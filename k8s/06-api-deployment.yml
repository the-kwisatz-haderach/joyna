apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: joyna
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: europe-north2-docker.pkg.dev/joyna-505918/joyna/api:<tag>
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyna-secrets
                  key: DATABASE_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: joyna-config
                  key: APP_ENV
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: joyna-config
                  key: APP_PORT
