{{- if .Values.notifier.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: '{{.Release.Name}}-notifier'
  namespace: {{.Release.Namespace}}
  labels: {{- include "joyna.selectorLabels" . | nindent 4}}
spec:
  schedule: {{required "notifier.schedule is required" .Values.notifier.schedule | quote}}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: notifier
              image: '{{.Values.notifier.image.repository}}:{{required "notifier.image.tag is required" .Values.notifier.image.tag}}'
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: '{{.Release.Name}}-secrets'
                      key: DATABASE_URL
                - name: APP_ENV
                  valueFrom:
                    configMapKeyRef:
                      name: '{{.Release.Name}}-configmap'
                      key: APP_ENV
{{- end}}
