apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-configmap'
  namespace: {{.Release.Namespace}}
  labels: {{- include "joyna.selectorLabels" . | nindent 4}}
data:
  APP_ENV: {{.Values.api.env | quote}}
  APP_PORT: {{.Values.api.port | quote}}
  POSTGRES_USER: {{.Values.postgres.user}}
  POSTGRES_DB: {{.Values.postgres.database}}
  SMTP_PORT: {{.Values.mail.smtpPort | quote}}
  SMTP_FROM: {{.Values.mail.smtpFrom | quote}}
  FRONTEND_URL: {{ required "frontendURL is required" .Values.frontendURL | quote}}
  VAPID_PUBLIC_KEY: {{.Values.push.publicKey | quote}}
  VAPID_SUBJECT: {{.Values.push.subject | quote}}
  # Every environment deployed via this chart is served over HTTPS through
  # the Gateway (see gateway.yaml) — unlike local dev, which sets neither
  # this nor APP_ENV=production and keeps COOKIE_SECURE's default (false).
  COOKIE_SECURE: "true"
