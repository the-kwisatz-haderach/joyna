apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{.Release.Name}}-frontend-route'
  namespace: {{.Values.namespace}}
  labels: {{- include "joyna.selectorLabels" . | nindent 4}}
spec:
  parentRefs:
    - name: '{{.Release.Name}}-gw'
  rules:
    - backendRefs:
        - name: {{include "joyna.frontendServiceName" .}}
          port: {{.Values.frontend.port}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{.Release.Name}}-api-route'
  namespace: {{.Values.namespace}}
spec:
  parentRefs:
    - name: '{{.Release.Name}}-gw'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{include "joyna.apiServiceName" .}}
          port: {{.Values.api.port}}
