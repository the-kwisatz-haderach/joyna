apiVersion: v1
kind: Secret
metadata:
  name: '{{.Release.Name}}-secrets'
  namespace: {{.Release.Namespace}}
  labels: {{- include "joyna.selectorLabels" . | nindent 4}}
type: Opaque
stringData:
  POSTGRES_PASSWORD: '{{ required "postgres.password is required" .Values.postgres.password}}'
  DATABASE_URL: 'postgres://{{.Values.postgres.user}}:{{.Values.postgres.password}}@{{include "joyna.postgresServiceName" .}}:{{.Values.postgres.port}}/{{.Values.postgres.database}}?sslmode=disable'
