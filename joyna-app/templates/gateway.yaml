apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: '{{.Release.Name}}-gw'
  namespace: {{.Values.namespace}}
  labels: {{- include "joyna.selectorLabels" . | nindent 4}}
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - protocol: HTTP
      port: 80
      name: '{{.Release.Name}}-gw-listener'
      allowedRoutes:
        namespaces:
          from: Same
