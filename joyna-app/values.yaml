# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

postgres:
  user: joyna
  database: joyna
  password: REPLACE_ME
  port: 5432
  image:
    repository: postgres
    tag: 16-alpine

api:
  port: 8080
  env: development
  image:
    repository: 'europe-north2-docker.pkg.dev/joyna-505918/joyna/api'
    tag: ''

migrate:
  enabled: true
  image:
    repository: 'europe-north2-docker.pkg.dev/joyna-505918/joyna/migrate'
    tag: ''

# Runs as a Kubernetes CronJob rather than a ticker inside the api process,
# so daily reminders aren't tied to any particular api replica staying up.
notifier:
  enabled: true
  schedule: '0 8 * * *'
  image:
    repository: 'europe-north2-docker.pkg.dev/joyna-505918/joyna/notifier'
    tag: ''

frontend:
  port: 8080
  image:
    repository: 'europe-north2-docker.pkg.dev/joyna-505918/joyna/frontend'
    tag: ''

# Base URL of the deployed frontend — used to build the registration link
# sent in network-invite emails (internal/platform/mail).
frontendURL: https://joyna-dev.mogva.dev

# Gateway hostname/TLS. staticIPName/certName reference GCP resources
# provisioned out-of-band (gcloud compute addresses / certificate-manager
# certificates — not managed by this chart, since they're one-time,
# long-lived infra rather than per-release state). certName must be a
# *regional* Certificate Manager certificate in the same region as the
# cluster — gke-l7-regional-external-managed doesn't support certificate
# maps (that's global-Gateway-only); the listener references the cert by
# name directly instead (see gateway.yaml's tls.options).
gateway:
  hostname: joyna-dev.mogva.dev
  staticIPName: joyna-dev-ip
  certName: joyna-dev-cert

# Non-secret SMTP settings for network-invite emails. Host/user/password
# live in values.secret.yaml (gitignored) since they're credentials.
mail:
  smtpPort: 587
  smtpFrom: no-reploy@mogva.dev

# VAPID settings for browser Web Push notifications (internal/platform/push).
# publicKey isn't secret — it's sent to the browser's push service on every
# subscribe — so it lives here rather than values.secret.yaml. privateKey is
# a real secret and lives there instead, same split as mail/smtp above.
push:
  publicKey: 'BOMMtdr8kDVFJQ9RlzC7EiXa0OQ8YE-sMH8BNWRG1YKZud4hc-Kq5sy2jZgq3Cdi32mMhr8AWkxyE59dM9vBvMM'
  subject: 'mailto:you@joyna.dev'
