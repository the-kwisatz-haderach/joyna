# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

postgres:
  user: joyna
  database: joyna
  password: REPLACE_ME
  port: 5432
  image:
    repository: postgres
    tag: 16-alpine

api:
  port: 8080
  env: development
  image:
    repository: 'europe-north2-docker.pkg.dev/joyna-505918/joyna/api'
    tag: ''

migrate:
  enabled: true
  image:
    repository: 'europe-north2-docker.pkg.dev/joyna-505918/joyna/migrate'
    tag: ''

# Runs as a Kubernetes CronJob rather than a ticker inside the api process,
# so daily reminders aren't tied to any particular api replica staying up.
notifier:
  enabled: true
  schedule: '0 8 * * *'
  image:
    repository: 'europe-north2-docker.pkg.dev/joyna-505918/joyna/notifier'
    tag: ''

frontend:
  port: 8080
  image:
    repository: 'europe-north2-docker.pkg.dev/joyna-505918/joyna/frontend'
    tag: ''

# Base URL of the deployed frontend — used to build the registration link
# sent in network-invite emails (internal/platform/mail).
frontendURL: http://34.2.48.78

# Non-secret SMTP settings for network-invite emails. Host/user/password
# live in values.secret.yaml (gitignored) since they're credentials.
mail:
  smtpPort: 587
  smtpFrom: no-reploy@mogva.dev
