name: Deploy New Version

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: last-deploy
          filters: |
            backend:
              - 'internal/**'
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
            migrations:
              - 'migrations/**'
            frontend:
              - 'frontend/**'

  build-api:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: $/.github/workflows/build-and-push.yml
    with:
      gh_env: 'dev'
      imageName: 'api'
      dockerfile: 'Dockerfile'
      context: '.'
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: $/.github/workflows/build-and-push.yml
    with:
      gh_env: 'dev'
      imageName: 'frontend'
      dockerfile: 'frontend/Dockerfile'
      context: './frontend'
  build-migrate:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: $/.github/workflows/build-and-push.yml
    with:
      gh_env: 'dev'
      imageName: 'migrate'
      dockerfile: 'Dockerfile.migrate'
      context: '.'
  deploy-api:
    runs-on: ubuntu-latest
    needs: [changes, build-api, build-migrate]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      needs.build-api.result != 'failure' &&
      needs.build-api.result != 'cancelled' &&
      needs.build-migrate.result != 'failure'
    environment:
      name: dev
      deployment: true
      url: http://${{ steps.gateway.outputs.ip }}
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        id: auth
        with:
          token_format: 'access_token'
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GH_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GCP_GKE_CLUSTER }}
          location: ${{ vars.GCP_GKE_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Get Gateway IP
        id: gateway
        run: |
          ip=$(kubectl get gateway joyna-gw -n joyna -o jsonpath='{.status.addresses[0].value}')
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Setup helm
        uses: azure/setup-helm@v5
      - name: Setup secrets
        run: |
          cat <<EOF > joyna-app/values.secret.yaml
          postgres:
            password: ${{ secrets.POSTGRES_PASSWORD }}
          EOF

      - name: Helm lint
        run: |
          make helm-lint

      - name: Helm diff
        run: |
          make helm-diff

      - name: Helm upgrade api
        run: |
          make helm-upgrade-api

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    environment:
      name: dev
      deployment: false
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        id: auth
        with:
          token_format: 'access_token'
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GH_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GCP_GKE_CLUSTER }}
          location: ${{ vars.GCP_GKE_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup helm
        uses: azure/setup-helm@v5
      - name: Setup secrets
        run: |
          cat <<EOF > joyna-app/values.secret.yaml
          postgres:
            password: ${{ secrets.POSTGRES_PASSWORD }}
          EOF

      - name: Helm lint
        run: |
          make helm-lint

      - name: Helm diff
        run: |
          make helm-diff

      - name: Helm upgrade frontend
        run: |
          make helm-upgrade-frontend

  finalize:
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-frontend]
    if: |
      always() &&
      needs.deploy-api.result != 'failure' &&
      needs.deploy-api.result != 'cancelled' &&
      needs.deploy-frontend.result != 'cancelled' &&
      needs.deploy-frontend.result != 'failure'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Move last-deploy tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f last-deploy
          git push origin last-deploy --force
