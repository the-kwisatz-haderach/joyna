name: Dependabot auto-merge
on:
  pull_request:
  check_suite:
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  arm-auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # check_suite fires once per check suite completion - covering every
  # workflow and app (Code Quality, Frontend Check, CodeQL, ...) without
  # naming them here, so "all checks passed" stays whatever GitHub's own
  # merge check says it is rather than a hardcoded list going stale. Only
  # nudges PRs the job above already armed (update-type gate already passed
  # there); merge is a no-op if the PR isn't actually mergeable yet (other
  # checks still running, review missing, etc.), so it's safe to attempt on
  # every suite completion.
  merge-when-green:
    if: github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          pr_number=$(jq -r '.check_suite.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$pr_number" ]; then
            exit 0
          fi
          armed=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json author,autoMergeRequest \
            --jq 'select(.author.login == "dependabot[bot]" and .autoMergeRequest != null) | "yes"')
          if [ "$armed" = "yes" ]; then
            gh pr merge --squash "$pr_number" --repo "$GITHUB_REPOSITORY" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
